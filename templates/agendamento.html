{% extends "base.html" %}
{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/agendamento.css') }}">
{% endblock %}

{% block content %}
<form action="/agendamento" method="POST" class="agendamento">
    <div class="agendamento-container">
        <div class="secao-servicos">
            <h2 class="secao-servicos-titulo">Escolha o serviço</h2>
            <div class="secao-servicos-grid">

                
                <label for="servico1" class="card-servico">
                    <input type="radio" id="servico1" name="servico" value="Corte Tradicional" class="input-escondido" required>
                    <h3 class="servico-titulo">Corte Tradicional</h3>
                    <p class="servico-descricao">Corte clássico com tesoura e máquina</p>
                    <div class="servico-rodape">
                        <p class="servico-rodape-preco">R$ 45</p>
                        <p class="servico-rodape-tempo">40 min</p>
                    </div>
                </label>

                
                <label for="servico2" class="card-servico">
                    <input type="radio" id="servico2" name="servico" value="Barba Completa" class="input-escondido" required>
                    <h3 class="servico-titulo">Barba Completa</h3>
                    <p class="servico-descricao">Barba desenhada com toalha quente</p>
                    <div class="servico-rodape">
                        <p class="servico-rodape-preco">R$ 35</p>
                        <p class="servico-rodape-tempo">30 min</p>
                    </div>
                </label>

            
                <label for="servico3" class="card-servico">
                    <input type="radio" id="servico3" name="servico" value="Combo Premium" class="input-escondido" required>
                    <h3 class="servico-titulo">Combo Premium</h3>
                    <p class="servico-descricao">Corte + Barba + Sobrancelha</p>
                    <div class="servico-rodape">
                        <p class="servico-rodape-preco">R$ 75</p>
                        <p class="servico-rodape-tempo">60 min</p>
                    </div>
                </label>

                
                <label for="servico4" class="card-servico">
                    <input type="radio" id="servico4" name="servico" value="Corte Infantil" class="input-escondido" required>
                    <h3 class="servico-titulo">Corte Infantil</h3>
                    <p class="servico-descricao">Corte especial para crianças até 12 anos</p>
                    <div class="servico-rodape">
                        <p class="servico-rodape-preco">R$ 35</p>
                        <p class="servico-rodape-tempo">30 min</p>
                    </div>
                </label>

                
                <label for="servico5" class="card-servico">
                    <input type="radio" id="servico5" name="servico" value="Pigmentação" class="input-escondido" required>
                    <h3 class="servico-titulo">Pigmentação</h3>
                    <p class="servico-descricao">Pigmentação de barba e cabelo</p>
                    <div class="servico-rodape">
                        <p class="servico-rodape-preco">R$ 55</p>
                        <p class="servico-rodape-tempo">45 min</p>
                    </div>
                </label>

                
                <label for="servico6" class="card-servico">
                    <input type="radio" id="servico6" name="servico" value="Design de Sobrancelha" class="input-escondido" required>
                    <h3 class="servico-titulo">Design de Sobrancelha</h3>
                    <p class="servico-descricao">Design e finalização com cera</p>
                    <div class="servico-rodape">
                        <p class="servico-rodape-preco">R$ 25</p>
                        <p class="servico-rodape-tempo">20 min</p>
                    </div>
                </label>
            </div>
        </div>
        <div class="secao-data">
            <h2 class="secao-data-titulo">Escolha a data</h2>
            <label for="data-agendamento" class="input-data-label">
                <input type="date" id="data-agendamento" name="data" class="input-data" required  >
            </label>
        </div>
        <div class="secao-barbeiros">
            <h2 class="secao-barbeiros-titulo">Escolha o barbeiro</h2>
            <div class="barbeiros-cards">
                <label for="barbeiro1" class="card-barbeiro">
                    <div class="card-barbeiro-container">
                        <input type="radio" id="barbeiro1" name="barbeiro" value="Carlos Silva" class="input-escondido"  required>
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&h=300&fit=crop" alt="Foto do Carlos Silva" class="barbeiro-imagem">
                        <div class="barbeiros-card-textos">
                            <h3 class="card-textos-titulo">Carlos Silva</h3>
                            <p class="card-textos-descricao">Especialista em Cortes Clássicos</p>
                        </div>
                    </div>
                </label>

                <label for="barbeiro2" class="card-barbeiro">
                    <div class="card-barbeiro-container">
                        <input type="radio" id="barbeiro2" name="barbeiro" value="Roberto Santos" class="input-escondido"  required>
                        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=300&h=300&fit=crop" alt="Foto do Roberto Santos" class="barbeiro-imagem">
                        <div class="barbeiros-card-textos">
                            <h3 class="card-textos-titulo">Roberto Santos</h3>
                            <p class="card-textos-descricao">Mestre em Barbas e Degradês</p>
                        </div>
                    </div>
                </label>

                <label for="barbeiro3" class="card-barbeiro">
                    <div class="card-barbeiro-container">
                        <input type="radio" id="barbeiro3" name="barbeiro" value="André Costa" class="input-escondido"  required>
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300&h=300&fit=crop" alt="Foto do André Costa" class="barbeiro-imagem">
                        <div class="barbeiros-card-textos">
                            <h3 class="card-textos-titulo">André Costa</h3>
                            <p class="card-textos-descricao">Cortes Modernos e Pigmentação</p>
                        </div>
                    </div>
                </label>

                <label for="barbeiro4" class="card-barbeiro">
                    <div class="card-barbeiro-container">
                        <input type="radio" id="barbeiro4" name="barbeiro" value="Felipe Oliveira" class="input-escondido"  required>
                        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=300&h=300&fit=crop" alt="Foto do Felipe Oliveira" class="barbeiro-imagem">
                        <div class="barbeiros-card-textos">
                            <h3 class="card-textos-titulo">Felipe Oliveira</h3>
                            <p class="card-textos-descricao">Especialista em Cortes Infantis</p>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="secao-horarios">
            <h2>Escolha o Horário</h2>
            <div class="horarios-grid">
                    <input type="radio" id="hora-0900" name="horario" value="09:00" class="input-escondido" required>
                    <label for="hora-0900" class="btn-horario">09:00</label>

                    <input type="radio" id="hora-0930" name="horario" value="09:30" class="input-escondido" required>
                    <label for="hora-0930" class="btn-horario">09:30</label>

                    <input type="radio" id="hora-1000" name="horario" value="10:00" class="input-escondido" required>
                    <label for="hora-1000" class="btn-horario">10:00</label>

                    <input type="radio" id="hora-1030" name="horario" value="10:30" class="input-escondido" required>
                    <label for="hora-1030" class="btn-horario">10:30</label>

                    <input type="radio" id="hora-1100" name="horario" value="11:00" class="input-escondido" required>
                    <label for="hora-1100" class="btn-horario">11:00</label>

                    <input type="radio" id="hora-1130" name="horario" value="11:30" class="input-escondido" required>
                    <label for="hora-1130" class="btn-horario">11:30</label>

                    <input type="radio" id="hora-1200" name="horario" value="12:00" class="input-escondido" required>
                    <label for="hora-1200" class="btn-horario">12:00</label>

                    <input type="radio" id="hora-1230" name="horario" value="12:30" class="input-escondido" required>
                    <label for="hora-1230" class="btn-horario">12:30</label>

                    <input type="radio" id="hora-1300" name="horario" value="13:00" class="input-escondido" required>
                    <label for="hora-1300" class="btn-horario">13:00</label>

                    <input type="radio" id="hora-1330" name="horario" value="13:30" class="input-escondido" required>
                    <label for="hora-1330" class="btn-horario">13:30</label>

                    <input type="radio" id="hora-1400" name="horario" value="14:00" class="input-escondido" required>
                    <label for="hora-1400" class="btn-horario">14:00</label>

                    <input type="radio" id="hora-1430" name="horario" value="14:30" class="input-escondido" required>
                    <label for="hora-1430" class="btn-horario">14:30</label>

                    <input type="radio" id="hora-1500" name="horario" value="15:00" class="input-escondido" required>
                    <label for="hora-1500" class="btn-horario">15:00</label>

                    <input type="radio" id="hora-1530" name="horario" value="15:30" class="input-escondido" required>
                    <label for="hora-1530" class="btn-horario">15:30</label>

                    <input type="radio" id="hora-1600" name="horario" value="16:00" class="input-escondido" required>
                    <label for="hora-1600" class="btn-horario">16:00</label>

                    <input type="radio" id="hora-1630" name="horario" value="16:30" class="input-escondido" required>
                    <label for="hora-1630" class="btn-horario">16:30</label>

                    <input type="radio" id="hora-1700" name="horario" value="17:00" class="input-escondido" required>
                    <label for="hora-1700" class="btn-horario">17:00</label>

                    <input type="radio" id="hora-1730" name="horario" value="17:30" class="input-escondido" required>
                    <label for="hora-1730" class="btn-horario">17:30</label>

                    <input type="radio" id="hora-1800" name="horario" value="18:00" class="input-escondido" required>
                    <label for="hora-1800" class="btn-horario">18:00</label>
            </div>
        </div>
        
    </div>
</form>
{% endblock %}
